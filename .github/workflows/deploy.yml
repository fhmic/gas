# Deploys the Worker to Cloudflare on every push to main, and on demand from
# the Actions tab (Run workflow) to retrigger without a new commit.
#
# One-time setup, in the GitHub repo under Settings -> Secrets and variables
# -> Actions -> New repository secret:
#   CLOUDFLARE_API_TOKEN   (token with the "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard -> Workers & Pages -> right sidebar)
#
# Worker runtime secrets (SUPABASE_*, LLM keys, etc.) are NOT touched by this;
# they stay as already set with `wrangler secret put`.
name: Deploy Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
